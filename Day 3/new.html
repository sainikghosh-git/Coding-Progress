<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent {
            width: 200px;
            height: 200px;
            border: 10px solid rgb(64, 172, 70);
            margin: 100px auto;
            position: relative;
        }
        #child {
            width: 50px;
            height: 50px;
            background-color: rgb(29, 94, 168);
            left: 75px;
            top: 75px;
            position: absolute;
        }
    </style>
</head>
<body>
    <div id="parent">
        <div id="child"></div>
    </div>
</body>
</html>
