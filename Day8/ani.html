<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 100px;
            width: 100px;
            background-color: red;
        }
        div:hover{
            animation-name: anime;
            animation-duration: 3s;
        }

        @keyframes anime {
            0%{
                background-color: aqua;
                border-radius: 505;
            }
            50%{
                background-color: black;
                height: 100vh;
                width: 100vw;
            }
            100%{
                background-color: aqua;
                height: 30%;
                width: 70%;
                border-radius: 30%;
            }
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
