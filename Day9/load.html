<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .load {
            width: 100px;
            height: 100px;
            border: black 5px solid;
            border-radius: 50%;
            
            
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            
        }
        .circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin: 10px;
            animation-name: bounce;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-timing-function: ease-in;
        }

        .circle:nth-child(1) {
            background-color:linear-gradient(red,blue);
        }

        .circle:nth-child(2) {
            background-color:linear-gradient(green,blue);
        }

        .circle:nth-child(3) {
            background-color:linear-gradient(yellow,blue);
        }

        
        
    </style>    
</head>
<body>
    
    <div class="load">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
</body>
</html>
