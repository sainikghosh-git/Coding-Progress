<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>My First Page</title>

<body>
<!-- This is a comment. The browser does not show it. -->
<h1>Main Heading</h1>
<h2>Sub Heading</h2>
<h3>Smaller Heading</h3>
<p>This is a paragraph.</p>
<p>Line one<br>Line two (after a line break)</p>
<hr>
<p>Text can be <b>bold</b>, <i>italic</i>, <u>underlined</u>
or <mark>highlighted</mark>.</p>
<p><strong>Warning:</strong> <em>this word</em> is emphasised.</p>
<p>Water is H<sub>2</sub>O and area is r<sup>2</sup>.</p>
</body>
