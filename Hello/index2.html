<!DOCTYPE html>
<html>
<head>
<title>Links</title>
</head>
<body>
<h1 id="top">Links Demo</h1>
<!-- 1. External link (absolute URL) -->
<a href="https://www.google.com">Open Google</a><br>
<!-- 2. Open in a new tab, with a tooltip -->
<a href="https://www.wikipedia.org" target="_blank" title="Opens Wikipedia">
Wikipedia (new tab)
</a><br>
<!-- 3. Another page in the same folder (relative URL) -->
<a href="about.html">About Page</a><br>
<!-- 4. Email and phone links -->
<a href="mailto:student@example.com">Send Email</a><br>
<a href="tel:+919876543210">Call Us</a>
<!-- 5. Jump to a section on the same page -->
<p><a href="#contact">Go to Contact section</a></p>
<p>Section 1 ...</p>
<p>Section 2 ...</p>
<p>Section 3 ...</p>
<h2 id="contact">Contact</h2>
<p>Email us any time.</p>
<a href="#top">Back to top</a>
</body>
</html>
