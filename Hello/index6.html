<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
<title>div and span</title>
</head>
<body>
<!-- The style attribute is covered in CSS Basics; here it only makes the boxes visible -->
<div style="background-color: lightblue; padding: 10px;">
<h2>Section 1</h2>
<p>This div groups a heading and a paragraph.</p>
</div>
<div style="background-color: lightgreen; padding: 10px;">
<h2>Section 2</h2>
<p>Price: <span style="color: red; font-weight: bold;">Rs. 499</span> only.</p>
</div>
<!-- Block vs inline -->
<div style="border: 2px solid black;">div 1</div>
<div style="border: 2px solid black;">div 2</div>
<span style="border: 2px solid red;">span 1</span>
<span style="border: 2px solid red;">span 2</span>
</body>
</html>
</body>
</html>
