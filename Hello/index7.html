<!DOCTYPE html>
<html>
<head>
<style>
.box {
width: 200px;
height: 100px;
padding: 20px;
border: 5px solid black;
margin: 30px;
background-color: lightblue;
}
.content-box {
box-sizing: content-box; /* default */
}
.border-box {
box-sizing: border-box;
}
.centered {
width: 300px;
margin: 0 auto; /* centre horizontally */
padding: 10px 20px; /* 10px top-bottom, 20px left-right */
border: 3px dashed darkred;
border-radius: 10px;
}
</style>
</head>
<body>
<div class="box content-box">content-box: total width 250px</div>
<div class="box border-box">border-box: total width 200px</div>
<div class="centered">I am centred with margin: 0 auto</div>
</body>
</html>
