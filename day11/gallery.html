<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
        }

        h1 {
            text-align: start;
            font-size: 50px;
            color: #fff;
            margin-left: 30px;
        }

        p {
            text-align: start;
            font-size: 20px;
            color: #fff;
            margin-left: 30px;
        }

        .main {
            height: 80vh;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            border-radius: 5px;
            padding: 10px;

        }

        .int {
            border: 1px solid white;
            border-radius: 20px;
            overflow: hidden;

            position: relative;
            cursor: pointer;


        }

        .int img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            transition: 2s;



        }

        .int:hover img {
            transform: scale(1.1);




        }

        .one {
            grid-column: span 2;
            grid-row: span 2;
        }

        h3 {
            color: #fff;
            z-index: 1;
        }

        .text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(16, 2, 2, 0.5);
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .int:hover .text {
            opacity: 1;

        }

        .aa {
            font-size: 30px;
        }

        .int:hover h3 {
            transform: translateY(-10px);
            transition: 0.5s;
        }
    </style>
</head>

<body>

    </div>
